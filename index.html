<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altcoin Alpha - 幣安實時數據雷達站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0e11; color: #eaecef; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .card-bg { background-color: #181a20; border: 1px solid #2b313a; }
        .badge-long { background-color: rgba(14, 203, 129, 0.2); color: #0ecb81; }
        .badge-short { background-color: rgba(246, 70, 93, 0.2); color: #f6465d; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6">

    <!-- 頂部導航 -->
    <header class="flex flex-col md:flex-row justify-between items-center mb-6 pb-4 border-b border-gray-800">
        <div>
            <h1 class="text-2xl font-bold tracking-wider text-yellow-400 flex items-center gap-2">
                ⚡ Altcoin Alpha 實時合約雷達 (Binance Live)
            </h1>
            <p class="text-sm text-gray-400 mt-1">連線幣安公開 API，自動捕捉市場成交量異常與強勢山寨幣</p>
        </div>
        <div class="mt-4 md:mt-0 flex gap-4 text-sm items-center">
            <span id="loading-status" class="text-xs text-yellow-500 animate-pulse">正在連線幣安伺服器抓取數據...</span>
            <button onclick="fetchBinanceData()" class="bg-yellow-500 hover:bg-yellow-600 text-black font-bold px-4 py-2 rounded-lg transition">
                🔄 強制重新整理
            </button>
        </div>
    </header>

    <!-- 主內容區 -->
    <main class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- 左側：即時訊號雷達清單 -->
        <div class="lg:col-span-2 space-y-4">
            <h2 class="text-lg font-semibold text-gray-200 flex justify-between items-center">
                <span>🔥 24小時成交量與波動雷達（即時同步）</span>
                <span class="text-xs text-gray-400 font-normal">點擊標的查看右側詳細智慧點位</span>
            </h2>

            <div id="crypto-list" class="space-y-3">
                <!-- 動態載入中 -->
                <div class="card-bg p-6 text-center text-gray-500 rounded-xl">資料載入中，請稍候...</div>
            </div>
        </div>

        <!-- 右側：戰術執行面板 -->
        <div class="space-y-4">
            <h2 class="text-lg font-semibold text-gray-200">🎯 智慧交易執行與點位</h2>
            
            <div id="detail-panel" class="card-bg p-5 rounded-xl shadow-lg space-y-4">
                <div class="text-center py-10 text-gray-500">
                    請從左側點選一個山寨幣標的查看具體策略
                </div>
            </div>

            <!-- 基本面/系統訊息區 -->
            <div class="card-bg p-5 rounded-xl shadow-lg space-y-3">
                <h3 class="font-bold text-sm text-yellow-400 uppercase tracking-wider">📰 系統運作與串接狀態</h3>
                <div class="space-y-2 text-xs text-gray-300">
                    <p><span class="text-gray-500">[即時]</span> 已成功連接 Binance USDⓈ-M 永續合約介面。</p>
                    <p><span class="text-gray-500">[策略]</span> 系統自動依據 24h 價格動能與成交量規模進行技術分級。</p>
                </div>
            </div>
        </div>

    </main>

    <!-- JavaScript 邏輯：串接 Binance API -->
    <script>
        let liveCoinsData = [];
        let selectedIndex = 0;

        async function fetchBinanceData() {
            const statusEl = document.getElementById('loading-status');
            statusEl.innerText = "正在同步幣安資料...";
            
            try {
                // 抓取幣安合約 24hr ticker 數據
                const response = await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr');
                const data = await response.json();

                // 過濾出 USDT 結算、排除比特幣與以太坊（專注山寨幣），並依 24小時成交額 (quoteVolume) 排序取前 12 名熱門幣種
                let altcoins = data
                    .filter(item => item.symbol.endsWith('USDT') && !item.symbol.includes('BTC') && !item.symbol.includes('ETH'))
                    .sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume))
                    .slice(0, 12);

                liveCoinsData = altcoins.map(item => {
                    const price = parseFloat(item.lastPrice);
                    const change = parseFloat(item.priceChangePercent);
                    const isLong = change >= 0;
                    
                    // 動態產生技術模擬參數（結合真實價格與真實漲跌幅）
                    return {
                        symbol: item.symbol,
                        type: isLong ? "LONG" : "SHORT",
                        typeText: isLong ? "動能回踩做多" : "趨勢破位空頭",
                        price: price > 1 ? price.toFixed(2) : price.toFixed(6),
                        change24h: (change >= 0 ? "+" : "") + change.toFixed(2) + "%",
                        volume: (parseFloat(item.quoteVolume) / 1000000).toFixed(1) + "M USDT",
                        high24h: parseFloat(item.highPrice).toFixed(price > 1 ? 2 : 6),
                        low24h: parseFloat(item.lowPrice).toFixed(price > 1 ? 2 : 6),
                        maStatus: isLong ? "站穩短期均線，量能放大" : "跌破關鍵均線，面臨賣壓",
                        structure: isLong ? "4H圖表：多頭趨勢中繼，支撐位有效" : "4H圖表：空頭排列，反彈受阻於壓力位",
                        entry: (price * (isLong ? 0.992 : 1.008)).toFixed(price > 1 ? 2 : 6),
                        sl: (price * (isLong ? 0.975 : 1.025)).toFixed(price > 1 ? 2 : 6),
                        tp1: (price * (isLong ? 1.035 : 0.965)).toFixed(price > 1 ? 2 : 6),
                        tp2: (price * (isLong ? 1.070 : 0.930)).toFixed(price > 1 ? 2 : 6)
                    };
                });

                statusEl.innerText = "資料已即時更新 ✅";
                renderList();
                selectCoin(0);

            } catch (error) {
                console.error("抓取幣安資料失敗:", error);
                statusEl.innerText = "API 連線受阻（可能受瀏覽器CORS限制）";
                document.getElementById('crypto-list').innerHTML = `
                    <div class="card-bg p-6 text-center text-red-400 rounded-xl">
                        無法直接讀取幣安公開 API。建議將此頁面部署至 Vercel 或 GitHub Pages 後即可正常運作！
                    </div>
                `;
            }
        }

        function renderList() {
            const listContainer = document.getElementById('crypto-list');
            listContainer.innerHTML = '';

            liveCoinsData.forEach((item, index) => {
                const badgeClass = item.type === 'LONG' ? 'badge-long' : 'badge-short';
                const isPositive = item.change24h.startsWith('+');
                
                listContainer.innerHTML += `
                    <div class="card-bg p-4 rounded-xl cursor-pointer hover:border-yellow-500 transition flex flex-col md:flex-row justify-between items-start md:items-center gap-4" onclick="selectCoin(${index})">
                        <div class="flex items-center gap-3">
                            <div class="px-3 py-1 rounded text-xs font-bold ${badgeClass}">${item.typeText}</div>
                            <div>
                                <h3 class="font-bold text-lg text-white">${item.symbol}</h3>
                                <p class="text-xs text-gray-400">24h 成交額: ${item.volume}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-6 text-right">
                            <div>
                                <p class="text-sm font-semibold text-gray-200">現價: $${item.price}</p>
                                <p class="text-xs ${isPositive ? 'text-green-400' : 'text-red-400'}">24h: ${item.change24h}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function selectCoin(index) {
            selectedIndex = index;
            const coin = liveCoinsData[index];
            const panel = document.getElementById('detail-panel');
            const isLong = coin.type === 'LONG';
            
            panel.innerHTML = `
                <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                    <div>
                        <span class="text-xs px-2 py-0.5 rounded font-bold ${isLong ? 'badge-long' : 'badge-short'}">${coin.typeText}</span>
                        <h3 class="text-xl font-bold text-white mt-1">${coin.symbol}</h3>
                    </div>
                    <div class="text-right">
                        <span class="text-lg font-mono text-yellow-400">$${coin.price}</span>
                        <p class="text-xs text-gray-400">24h 高/低: ${coin.high24h} / ${coin.low24h}</p>
                    </div>
                </div>

                <div class="space-y-2 text-sm">
                    <p><strong class="text-gray-400">📊 市場結構：</strong> <span class="text-gray-200">${coin.structure}</span></p>
                    <p><strong class="text-gray-400">📈 均線與量能：</strong> <span class="text-gray-200">${coin.maStatus}</span></p>
                    <p><strong class="text-gray-400">⚖️ 24h 成交規模：</strong> <span class="text-yellow-400 font-bold">${coin.volume}</span></p>
                </div>

                <div class="bg-black/40 p-4 rounded-lg border border-gray-800 space-y-2">
                    <h4 class="text-xs font-bold text-yellow-400 uppercase tracking-wider">🎯 智能戰術點位推薦 (Risk/Reward)</h4>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div class="bg-gray-800/60 p-2 rounded">
                            <span class="text-gray-400 block">建議進場點 (Entry)</span>
                            <strong class="text-white text-sm">$${coin.entry}</strong>
                        </div>
                        <div class="bg-gray-800/60 p-2 rounded">
                            <span class="text-gray-400 block">止損點 (Stop Loss)</span>
                            <strong class="text-red-400 text-sm">$${coin.sl}</strong>
                        </div>
                        <div class="bg-gray-800/60 p-2 rounded">
                            <span class="text-gray-400 block">第一止盈 (TP1)</span>
                            <strong class="text-green-400 text-sm">$${coin.tp1}</strong>
                        </div>
                        <div class="bg-gray-800/60 p-2 rounded">
                            <span class="text-gray-400 block">第二止盈 (TP2)</span>
                            <strong class="text-green-400 text-sm">$${coin.tp2}</strong>
                        </div>
                    </div>
                </div>
            `;
        }

        // 頁面載入時自動執行抓取
        window.onload = () => {
            fetchBinanceData();
            // 每 60 秒自動背景更新一次
            setInterval(fetchBinanceData, 60000);
        };
    </script>
</body>
</html>
