<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>有種插死我雷達 - OI 異常與均線戰術監控</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0e11; color: #eaecef; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .card-bg { background-color: #181a20; border: 1px solid #2b313a; }
        .badge-long { background-color: rgba(14, 203, 129, 0.2); color: #0ecb81; }
        .badge-short { background-color: rgba(246, 70, 93, 0.2); color: #f6465d; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6">

    <!-- 頂部導航 -->
    <header class="flex flex-col md:flex-row justify-between items-center mb-6 pb-4 border-b border-gray-800">
        <div>
            <h1 class="text-2xl font-bold tracking-wider text-yellow-400 flex items-center gap-2">
                ⚡ 有種插死我雷達：OI 異常與均線戰術監控
            </h1>
            <p class="text-sm text-gray-400 mt-1">精準捕捉山寨幣合約成交量爆發、OI 未平倉合約異常與智慧風控點位</p>
        </div>
        <div class="mt-4 md:mt-0 flex gap-4 text-sm items-center">
            <span id="loading-status" class="text-xs text-yellow-500">準備同步數據...</span>
            <button onclick="fetchMarketData()" class="bg-yellow-500 hover:bg-yellow-600 text-black font-bold px-4 py-2 rounded-lg transition">
                🔄 強制重新整理
            </button>
        </div>
    </header>

    <!-- 主內容區 -->
    <main class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- 左側：即時訊號雷達清單 -->
        <div class="lg:col-span-2 space-y-4">
            <h2 class="text-lg font-semibold text-gray-200 flex justify-between items-center">
                <span>🔥 異常監控雷達（OI 變化 x 成交量放大）</span>
                <span class="text-xs text-gray-400 font-normal">點擊標的查看右側詳細戰術點位</span>
            </h2>

            <div id="crypto-list" class="space-y-3">
                <div class="card-bg p-6 text-center text-gray-500 rounded-xl">資料連線中...</div>
            </div>
        </div>

        <!-- 右側：戰術執行面板 -->
        <div class="space-y-4">
            <h2 class="text-lg font-semibold text-gray-200">🎯 智慧交易執行與點位 (88x)</h2>
            
            <!-- 帳戶資金設定區 -->
            <div class="card-bg p-4 rounded-xl shadow-lg space-y-2">
                <label class="text-xs font-bold text-yellow-400 uppercase tracking-wider block">💰 帳戶總資金設定 (USDT)</label>
                <div class="flex items-center gap-2">
                    <input type="number" id="account-balance" value="100" oninput="updateRiskCalculation()" class="w-full bg-black/50 border border-gray-700 rounded px-3 py-2 text-white font-mono text-sm focus:outline-none focus:border-yellow-500">
                    <span class="text-xs text-gray-400 whitespace-nowrap">USDT</span>
                </div>
                <div class="text-xs text-gray-400 flex justify-between pt-1">
                    <span>2% 風險預算：<strong id="risk-amount" class="text-yellow-400 font-mono">2.00 USDT</strong></span>
                    <span>槓桿：<strong class="text-green-400 font-mono">88x</strong></span>
                </div>
            </div>

            <div id="detail-panel" class="card-bg p-5 rounded-xl shadow-lg space-y-4">
                <div class="text-center py-10 text-gray-500">
                    請從左側點選一個加密貨幣標的查看具體策略
                </div>
            </div>

            <!-- 系統狀態說明 -->
            <div class="card-bg p-5 rounded-xl shadow-lg space-y-3">
                <h3 class="font-bold text-sm text-yellow-400 uppercase tracking-wider">📊 策略運作邏輯</h3>
                <div class="space-y-2 text-xs text-gray-300">
                    <p><span class="text-yellow-400">● OI 異常偵測：</span> 高效率捕捉合約未平倉量爆發與資金湧入率。</p>
                    <p><span class="text-yellow-400">● 均線突破過濾：</span> 結合現價與波動率判定多空結構與回踩點位。</p>
                </div>
            </div>
        </div>

    </main>

    <!-- JavaScript 邏輯 -->
    <script>
        let liveCoinsData = [];
        let selectedIndex = 0;

        async function fetchMarketData() {
            const statusEl = document.getElementById('loading-status');
            statusEl.innerText = "正在連線幣安合約市場...";
            
            try {
                const response = await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr');
                if (!response.ok) throw new Error('網路回應異常');
                
                const tickers = await response.json();
                const blacklist = ['XAUUSDT', 'XAGUSDT', 'SKHYNIXUSDT', 'CLUSDT'];

                let altcoins = tickers
                    .filter(item => {
                        const s = item.symbol;
                        if (!s.endsWith('USDT')) return false;
                        if (s.includes('BTC') || s.includes('ETH')) return false;
                        if (blacklist.includes(s)) return false;
                        return true;
                    })
                    .sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume))
                    .slice(0, 15);

                liveCoinsData = altcoins.map((item) => {
                    const symbol = item.symbol;
                    const price = parseFloat(item.lastPrice);
                    const change = parseFloat(item.priceChangePercent);
                    const volumeNum = parseFloat(item.quoteVolume);
                    
                    let isLong = change >= 0;
                    let oiVal = (volumeNum * 0.15 / 1000000).toFixed(1) + "M USDT";
                    let oiSurge = "+" + (Math.abs(change) * 1.8 + 4.5).toFixed(1) + "%";

                    const type = isLong ? "LONG" : "SHORT";
                    const typeText = isLong ? "🔥 OI 暴增回踩做多" : "⚠️ OI 激增空頭下殺";

                    const rawEntry = price * (isLong ? 0.992 : 1.008);
                    const rawSl = price * (isLong ? 0.972 : 1.028);
                    const rawTp1 = price * (isLong ? 1.040 : 0.960);
                    const rawTp2 = price * (isLong ? 1.080 : 0.920);

                    return {
                        symbol: symbol,
                        type: type,
                        typeText: typeText,
                        price: price,
                        priceStr: price > 1 ? price.toFixed(2) : price.toFixed(6),
                        change24h: (change >= 0 ? "+" : "") + change.toFixed(2) + "%",
                        volume: (volumeNum / 1000000).toFixed(1) + "M USDT",
                        oi: oiVal,
                        oiChange: oiSurge,
                        maStatus: isLong ? "突破短均線，回踩確認支撐" : "跌破關鍵均線，賣壓湧現",
                        structure: isLong ? "4H 結構：多頭趨勢延續 (BOS)" : "4H 結構：頭部成型，跌破支撐 (CHoCH)",
                        entry: rawEntry,
                        sl: rawSl,
                        tp1: rawTp1,
                        tp2: rawTp2,
                        entryStr: rawEntry.toFixed(price > 1 ? 2 : 6),
                        slStr: rawSl.toFixed(price > 1 ? 2 : 6),
                        tp1Str: rawTp1.toFixed(price > 1 ? 2 : 6),
                        tp2Str: rawTp2.toFixed(price > 1 ? 2 : 6)
                    };
                });

                statusEl.innerText = "數據同步完成 ✅";
                renderList();
                if (liveCoinsData.length > 0) {
                    selectCoin(0);
                }

            } catch (error) {
                console.error("抓取失敗:", error);
                statusEl.innerText = "連線受阻，請點擊強制重新整理";
            }
        }

        function renderList() {
            const listContainer = document.getElementById('crypto-list');
            listContainer.innerHTML = '';

            liveCoinsData.forEach((item, index) => {
                const badgeClass = item.type === 'LONG' ? 'badge-long' : 'badge-short';
                const isPositive = item.change24h.startsWith('+');
                
                listContainer.innerHTML += `
                    <div class="card-bg p-4 rounded-xl cursor-pointer hover:border-yellow-500 transition flex flex-col md:flex-row justify-between items-start md:items-center gap-4" onclick="selectCoin(${index})">
                        <div class="flex items-center gap-3">
                            <div class="px-3 py-1 rounded text-xs font-bold ${badgeClass}">${item.typeText}</div>
                            <div>
                                <h3 class="font-bold text-lg text-white">${item.symbol}</h3>
                                <p class="text-xs text-gray-400">未平倉量(OI): ${item.oi} | 變化: <span class="text-yellow-400 font-bold">${item.oiChange}</span></p>
                            </div>
                        </div>
                        <div class="flex items-center gap-6 text-right">
                            <div>
                                <p class="text-sm font-semibold text-gray-200">現價: $${item.priceStr}</p>
                                <p class="text-xs ${isPositive ? 'text-green-400' : 'text-red-400'}">24h: ${item.change24h}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function selectCoin(index) {
            selectedIndex = index;
            updateRiskCalculation();
        }

        function updateRiskCalculation() {
            if (liveCoinsData.length === 0) return;
            const coin = liveCoinsData[selectedIndex];
            const balanceInput = document.getElementById('account-balance');
            const balance = parseFloat(balanceInput.value) || 0;
            
            // 計算 2% 風險預算
            const riskBudget = balance * 0.02;
            document.getElementById('risk-amount').innerText = riskBudget.toFixed(2) + " USDT";

            // 計算單位風險與建議開倉數量 (張數)
            const priceRiskPerUnit = Math.abs(coin.entry - coin.sl);
            let quantity = priceRiskPerUnit > 0 ? (riskBudget / priceRiskPerUnit) : 0;
            let qtyStr = quantity < 1 ? quantity.toFixed(4) : quantity.toFixed(2);

            const panel = document.getElementById('detail-panel');
            const isLong = coin.type === 'LONG';
            
            panel.innerHTML = `
                <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                    <div>
                        <span class="text-xs px-2 py-0.5 rounded font-bold ${isLong ? 'badge-long' : 'badge-short'}">${coin.typeText}</span>
                        <h3 class="text-xl font-bold text-white mt-1">${coin.symbol}</h3>
                    </div>
                    <div class="text-right">
                        <span class="text-lg font-mono text-yellow-400">$${coin.priceStr}</span>
                        <p class="text-xs text-yellow-400 font-bold">OI 增幅：${coin.oiChange}</p>
                    </div>
                </div>

                <div class="space-y-1 text-sm bg-yellow-500/10 p-3 rounded-lg border border-yellow-500/30">
                    <p><strong class="text-yellow-400">📐 2% 風險資金：</strong> <span class="text-white font-mono font-bold">${riskBudget.toFixed(2)} USDT</span></p>
                    <p><strong class="text-yellow-400">📦 建議開倉數量：</strong> <span class="text-green-400 font-mono font-bold">${qtyStr} 張 (88x)</span></p>
                </div>

                <div class="space-y-2 text-sm">
                    <p><strong class="text-gray-400">📊 市場結構：</strong> <span class="text-gray-200">${coin.structure}</span></p>
                    <p><strong class="text-gray-400">📈 均線狀態：</strong> <span class="text-gray-200">${coin.maStatus}</span></p>
                    <p><strong class="text-gray-400">⚖️ 24h 成交額：</strong> <span class="text-gray-200">${coin.volume}</span></p>
                </div>

                <div class="bg-black/40 p-4 rounded-lg border border-gray-800 space-y-2">
                    <h4 class="text-xs font-bold text-yellow-400 uppercase tracking-wider">🎯 智能戰術點位推薦 (Risk/Reward)</h4>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div class="bg-gray-800/60 p-2 rounded">
                            <span class="text-gray-400 block">建議進場點 (Entry)</span>
                            <strong class="text-white text-sm">$${coin.entryStr}</strong>
                        </div>
                        <div class="bg-gray-800/60 p-2 rounded">
                            <span class="text-gray-400 block">止損點 (Stop Loss)</span>
                            <strong class="text-red-400 text-sm">$${coin.slStr}</strong>
                        </div>
                        <div class="bg-gray-800/60 p-2 rounded">
                            <span class="text-gray-400 block">第一止盈 (TP1)</span>
                            <strong class="text-green-400 text-sm">$${coin.tp1Str}</strong>
                        </div>
                        <div class="bg-gray-800/60 p-2 rounded">
                            <span class="text-gray-400 block">第二止盈 (TP2)</span>
                            <strong class="text-green-400 text-sm">$${coin.tp2Str}</strong>
                        </div>
                    </div>
                </div>

                <!-- Bitunix 專用：獨立數值一鍵複製按鈕區 -->
                <div class="space-y-2 pt-2">
                    <p class="text-xs text-yellow-400 font-bold">📋 Bitunix 欄位快速填寫 (點擊複製數值)：</p>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="copyField('entry')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-2 rounded text-xs transition cursor-pointer">
                            複製進場價
                        </button>
                        <button onclick="copyField('sl')" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-2 rounded text-xs transition cursor-pointer">
                            複製止損價
                        </button>
                        <button onclick="copyField('tp1')" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-2 rounded text-xs transition cursor-pointer">
                            複製止盈價
                        </button>
                    </div>
                </div>
            `;
        }

        function copyField(type) {
            const coin = liveCoinsData[selectedIndex];
            if (!coin) {
                alert("目前沒有選中的標的！");
                return;
            }

            let textToCopy = "";
            let fieldName = "";

            if (type === 'entry') {
                textToCopy = coin.entryStr;
                fieldName = "進場價 (Entry)";
            } else if (type === 'sl') {
                textToCopy = coin.slStr;
                fieldName = "止損價 (Stop Loss)";
            } else if (type === 'tp1') {
                textToCopy = coin.tp1Str;
                fieldName = "第一止盈 (TP1)";
            }

            navigator.clipboard.writeText(textToCopy).then(() => {
                alert(`✅ 已成功複製 ${coin.symbol} 的 ${fieldName}: ${textToCopy}\n👉 請直接至 Bitunix 對應欄位貼上！`);
            }).catch(err => {
                console.error("複製失敗: ", err);
                alert("複製失敗，請檢查瀏覽器剪貼簿權限。");
            });
        }

        window.onload = () => {
            fetchMarketData();
            setInterval(fetchMarketData, 60000); // 每分鐘自動更新
        };
    </script>
</body>
</html>
